# Proxy Apache → Next.js (port 3100). Modules : proxy, proxy_http, headers, rewrite, ssl.
<VirtualHost *:443>
    ServerName seo.example.com
    SSLEngine on
    # SSLCertificateFile / SSLCertificateKeyFile : voir votre procédure Let's Encrypt existante

    ProxyPreserveHost On
    # IMPORTANT : Apache POSE X-Forwarded-For lui-même ; on supprime toute valeur envoyée par le client avant.
    RequestHeader unset X-Forwarded-For
    RequestHeader unset X-Real-IP
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPass        / http://127.0.0.1:3100/
    ProxyPassReverse / http://127.0.0.1:3100/

    # Les lots de logs sont plafonnés côté application (2 Mo) ; on borne aussi ici.
    LimitRequestBody 2097152
</VirtualHost>
